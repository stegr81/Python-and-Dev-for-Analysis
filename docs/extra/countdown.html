<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Timings</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #1e293b;
        color: white;
        font-family: Segoe UI, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .return-time {
        font-size: 3rem;
        margin-bottom: 2rem;
        opacity: 0.9;
    }

    .countdown {
        font-size: 8rem;
        font-weight: bold;
        letter-spacing: 0.1em;
    }

    .finished {
        color: #22c55e;
    }

    .hint {
        position: absolute;
        bottom: 20px;
        font-size: 1rem;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="return-time">
    Afternoon session<span id="targetDisplay"></span>
</div>

<div id="countdown" class="countdown">
    00:00
</div>

<div class="hint">
    Press F11 for full screen
</div>

<script>
    // Set your target time here (24-hour format)
    const targetHour = 13;
    const targetMinute = 10;

    const targetDisplay = document.getElementById("targetDisplay");
    const countdownEl = document.getElementById("countdown");

    targetDisplay.textContent =
        `${String(targetHour).padStart(2, '0')}:${String(targetMinute).padStart(2, '0')}`;

    function updateCountdown() {
        const now = new Date();

        const target = new Date();
        target.setHours(targetHour, targetMinute, 0, 0);

        const diff = target - now;

        if (diff <= 0) {
            countdownEl.textContent = "WELCOME BACK";
            countdownEl.classList.add("finished");
            return;
        }

        const totalSeconds = Math.floor(diff / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        countdownEl.textContent =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
